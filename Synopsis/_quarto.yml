project:
  type: book
  output-dir: ../public

# Global execution settings for ALL formats (HTML and PDF)
execute:
  freeze: auto   # Never re-runs code on unchanged files during book renders
  cache: true    # Caches chunk-level computations in the active file
  warning: false

book:
  title: "Microbiome Ecological Modeling"
  subtitle: "Simulation and Inference"
  author: "Carlos Olivares"
  date: "12/18/2025"
  chapters:
    - index.qmd
    # - summary.qmd
    - Introduction/intro.qmd
    # - context.qmd

    - part: "Methods"
      chapters:
        - Methods/methods.qmd
        # - Methods/inference.qmd
        # - Methods/simulations.qmd
    - part: "Results"
      chapters:
        - Results/results.qmd
        - Results/GLV_regression.qmd
        # - Results/TwoSpeciesGLVSystem.qmd
        # - discussion.qmd
    - references.qmd
  appendices: 
    - appendices/GIT.qmd
    - appendices/ProbabilityDistributions.qmd

bibliography: ../Bibliography/GLV_references.bib
csl: physical-review-letters.csl
# filters:
#   - add-file-links.lua
link-citations: true
citeproc: true

format:
  html:
    code-fold: true
    theme:
      - cosmo
      - brand
  pdf:
    documentclass: scrreprt
    execute:
      echo: false



